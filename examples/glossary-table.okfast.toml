# 設定例: 別名表（表形式の辞書）と、文字起こしのページを持つバンドル。
# 使い方: okfast -b <バンドルの root> --config examples/glossary-table.okfast.toml grep "Widget Pro"
# （バンドルの root に okfast.toml として置けば --config は要らない）

# 別名表（glossary/別名表.md）の表。1 行 = 1 概念
[[aliases.table]]
pages   = { path = "glossary/別名表.md" }
concept = "概念"
names   = "呼び名"
split   = ["、"]
boost   = "主題のページ"

# 文字起こしの誤認識は、文字起こしのページを検索するときだけ使う
[[aliases.table.conditional]]
column = "文字起こしの誤認識"
when   = { path = "references/transcripts/**" }

# ページごとに別名を書く形式（frontmatter の aliases）
[[aliases.frontmatter]]
keys = ["aliases"]

[aliases.match]
short_max = 3

[search]
# 文字起こし・README・辞書そのものは既定で除く（--all で含める）
exclude = ["references/transcripts/**", "README.md", "glossary/別名表.md"]
# okfast search（読む範囲を返す検索）: 範囲の見出しに出す frontmatter の値
show_keys = ["credibility"]

# 行の日付の取り方（新しい記録を足す・--since・--sort date）。先に書いたものから探す
[search.recent]
count         = 4
date_sources  = ["table_row", "frontmatter:date", "footnote_source", "heading"]
table_columns = ["日付"]

# 関連度によらず必ず出す範囲
[search.must_read]
topics   = 2
headings = ["未決", "矛盾"]
pages    = [{ path = "decisions/*.md", top = 3 }]

# 返した範囲の日付つきの行の時系列の一覧。行の種類と変更の印は、バンドルの書き方に合わせて宣言する
[search.timeline]
max        = 30
kinds      = [{ name = "decision", pattern = "【決定】" }, { name = "conclusion", pattern = "【結論】" }]
superseded = ["【結論・{date}に変更】"]
